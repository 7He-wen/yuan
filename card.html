<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>生辰信笺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;
  overflow:hidden;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Serif SC",serif;
  background:#f8f2ec;
  color:#442c2e;
  position:relative;
}
/* 容器层级 */
.stage{
  width:100vw;
  height:100vh;
  position:absolute;
  top:0;
  left:0;
}
.hide{display:none !important;}

/* 信封UI */
.envelope-wrap{
  width:82vw;
  max-width:420px;
  aspect-ratio:1.25/1;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}
.envelope{
  width:100%;
  height:100%;
  background:url('envelope.JPG') center / contain no-repeat;
  position:relative;
  transition:all 1.2s cubic-bezier(0.23,1,0.32,1);
}
.envelope.open{
  transform:translateY(-80px) scale(0.85);
  opacity:0;
}

/* 信纸：从信封开口缓慢滑出 */
.letter{
  width:72vw;
  max-width:370px;
  height:auto;
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%, 120%);
  opacity:0;
  transition:transform 1.6s cubic-bezier(0.22,1,0.36,1), opacity 1.4s;
}
.letter.show{
  opacity:1;
  transform:translate(-50%,-40%);
}

/* 文雅提示文字 */
.tip-text{
  position:absolute;
  bottom:14vh;
  left:50%;
  transform:translateX(-50%);
  font-size:1.1rem;
  letter-spacing:0.22em;
  color:#775456;
  font-style:italic;
  white-space:nowrap;
  opacity:0;
  transition:opacity 0.6s;
}
.tip-text.show{opacity:1;}

/* 粉色按钮 白色字体 */
.pink-btn{
  border:none;
  background:#f288a8;
  color:#ffffff;
  padding:14px 42px;
  border-radius:999px;
  font-size:1.15rem;
  letter-spacing:0.14em;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:12vh;
  opacity:0;
  transition:opacity 0.7s;
}
.pink-btn.show{opacity:1;}

/* 番外图片展示 */
.fanwai-img{
  width:84vw;
  max-width:440px;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  opacity:0;
  transition:opacity 0.8s;
}
.fanwai-img.show{opacity:1;}

/* 签筒界面 */
.qian-wrap{
  width:100vw;
  height:100vh;
  background:#e9dfd2;
  position:absolute;
  top:0;left:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.qian-title{
  font-size:1.4rem;
  letter-spacing:0.26em;
  margin-bottom:40px;
  color:#60383a;
}
.qian-barrel{
  width:64vw;
  max-width:320px;
  aspect-ratio:0.75;
  background:linear-gradient(145deg,#c84c42,#a8322c);
  border-radius:12px;
  position:relative;
  box-shadow:0 12px 30px rgba(80,30,25,0.28);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff8f8;
  font-size:1.3rem;
  letter-spacing:0.2em;
}
.qian-paper{
  width:76vw;
  max-width:400px;
  background:#fff9ef;
  border-radius:14px;
  padding:36px 28px;
  box-shadow:0 8px 24px rgba(60,30,20,0.18);
  text-align:center;
}
.qian-level{
  font-size:1.4rem;
  color:#b83c3c;
  margin-bottom:20px;
  letter-spacing:0.18em;
}
.qian-poem{
  font-size:1.1rem;
  line-height:2.2;
  margin-bottom:28px;
  letter-spacing:0.12em;
}
.circle-btn{
  width:62px;
  height:62px;
  border-radius:50%;
  border:2px solid #b83c3c;
  background:transparent;
  color:#b83c3c;
  font-size:0.95rem;
}
.jieqian-btn{
  margin-top:24px;
  border:none;
  background:#d45c54;
  color:#fff;
  padding:12px 30px;
  border-radius:99px;
  font-size:1rem;
}
.jie-text{
  margin-top:22px;
  line-height:1.85;
  font-size:0.98rem;
  text-align:left;
}

/* 结尾祝福页面 艺术字体+英文装饰 */
.end-page{
  width:100vw;
  height:100vh;
  position:absolute;
  top:0;left:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
}
.end-main{
  font-size:2.4rem;
  letter-spacing:0.32em;
  margin-bottom:16px;
}
.end-sub{
  font-size:1.2rem;
  letter-spacing:0.18em;
  margin-bottom:32px;
}
.end-en{
  font-size:1rem;
  opacity:0.65;
  font-style:italic;
}
</style>
</head>
<body>

<div id="app"></div>

<script>
// 获取url模式
const urlParams=new URLSearchParams(location.search);
let mode=urlParams.get('mode')||"happybirthday";

//三套配置
const configMap={
  happybirthday:{
    letterImg:"letter‑happybirthday.JPG",
    endTitle:"生日快乐",
    endSub:"祝你开心快乐",
    endEn:"Wish you joy & happiness all the way"
  },
  lucky:{
    letterImg:"letter‑lucky.JPG",
    endTitle:"四叶草🍀是为你而来",
    endSub:"",
    endEn:"May luck always be beside you"
  },
  autumn:{
    letterImg:"letter‑autumn.JPG",
    endTitle:"风若知秋",
    endSub:"寄此岁岁平安",
    endEn:"Wish you peace year after year"
  }
};
//兜底
if(!configMap[mode]) mode = "happybirthday";
const cfg=configMap[mode];

// 状态机
const STAGE={
  ENVELOPE:0,
  FANWAI:1,
  QIAN:2,
  END:3
};
let currentStage=STAGE.ENVELOPE;
let fanwaiIndex=0;
const fanwaiList=["fanwai.JPG","fanwai2.JPG"];

//渲染主App
function renderApp(){
  const app=document.getElementById("app");
  app.innerHTML=`
  <div class="stage" id="stage-env">
    <div class="envelope-wrap">
      <div class="envelope" id="env"></div>
      <img class="letter" id="letter" src="${cfg.letterImg}" alt="信纸">
    </div>
    <div class="tip-text" id="tipEnv">请轻触屏幕启封信笺</div>
  </div>

  <div class="stage hide" id="stage-fanwai">
    <img class="fanwai-img" id="fanImg" src="" alt="番外图片"/>
    <div class="tip-text" id="tipFan">请点击屏幕下一个</div>
    <button class="pink-btn" id="btnFan">番外</button>
  </div>

  <div class="stage hide" id="stage-qian">
    <div class="qian-wrap">
      <div class="qian-title">生辰一签</div>
      <div class="qian-barrel" id="barrel">点击求签</div>
      <div id="qianRes" class="hide">
        <div class="qian-paper">
          <div class="qian-level">娄星纳福 【上签 · 吉】</div>
          <div class="qian-poem">
娄曜临辰纳岁光，<br/>
前尘得失尽深藏。<br/>
胸怀旷达机缘至，<br/>
静守清风福满堂。
          </div>
          <button class="circle-btn" id="seeQian">看签</button>
          <div id="jieBlock" class="hide">
            <button class="jieqian-btn" id="btnJie">文胜大师解签</button>
            <div class="jie-text hide" id="jieText">
厚积得福之象<br/><br/>
此为收纳沉淀之吉签，不求一时轰轰烈烈，贵在把过往经历化作自身底气。机缘不急于即刻显现，心怀开阔，则好运徐徐而至。<br/><br/>
宜静不宜躁，适合复盘规划，蓄力沉淀。切勿冲动冒险求变，静待时机自有际遇登门。<br/><br/>
人缘和顺，易得旁人真诚惦念。偏爱细水长流，平淡相守胜过喧嚣热闹。<br/><br/>
守成为上，宜储蓄积累，忌冒进投机，安稳即是增益。<br/><br/>
往事皆沉淀，心宽福自来，<br/>
生辰逢吉曜，岁岁得安怀。
            </div>
          </div>
        </div>
        <div class="tip-text" id="tipQian">请点击页面继续</div>
      </div>
    </div>
  </div>

  <div class="stage hide" id="stage-end">
    <div class="end-page">
      <div class="end-main">${cfg.endTitle}</div>
      ${cfg.endSub?`<div class="end-sub">${cfg.endSub}</div>`:""}
      <div class="end-en">${cfg.endEn}</div>
    </div>
  </div>
  `;
  bindEvents();
}

function bindEvents(){
  const stageEnv=document.getElementById("stage-env");
  const env=document.getElementById("env");
  const letter=document.getElementById("letter");
  const tipEnv=document.getElementById("tipEnv");

  //第一步：点击屏幕，信纸滑出，**信纸动画完成后信封才消失**
  stageEnv.addEventListener("click",()=>{
    if(currentStage!==STAGE.ENVELOPE) return;
    tipEnv.classList.remove("show");
    letter.classList.add("show");
    //信纸1.6s动画结束，信封执行消失动画
    setTimeout(()=>{
      env.classList.add("open");
    },1600);
    //信纸完全出现后等待5秒，切换番外页面
    setTimeout(()=>{
      goFanwai();
    },5000);
  });

  function goFanwai(){
    currentStage=STAGE.FANWAI;
    document.getElementById("stage-env").classList.add("hide");
    const sf=document.getElementById("stage-fanwai");
    sf.classList.remove("hide");
    fanwaiIndex=0;
    showFanwaiImg();
  }

  function showFanwaiImg(){
    const fanImg=document.getElementById("fanImg");
    fanImg.src=fanwaiList[fanwaiIndex];
    fanImg.classList.add("show");
    const tipFan=document.getElementById("tipFan");
    tipFan.classList.add("show");
    const btnFan=document.getElementById("btnFan");
    btnFan.classList.remove("show");
    //展示图片3秒后显示番外按钮
    setTimeout(()=>{
      btnFan.classList.add("show");
    },3000);
  }

  //番外页面点击切换图片，阻止按钮冒泡
  document.getElementById("stage-fanwai").addEventListener("click",(e)=>{
    if(e.target.tagName==="BUTTON") return;
    fanwaiIndex++;
    const fanImg=document.getElementById("fanImg");
    fanImg.classList.remove("show");
    if(fanwaiIndex >= fanwaiList.length){
      //最后一张图片停留3秒再跳转签筒
      setTimeout(()=>{
        goQian();
      },3000);
      return;
    }
    setTimeout(()=>{
      showFanwaiImg();
    },400);
  });

  //番外按钮：直接跳转签筒
  document.getElementById("btnFan").onclick=()=>{
    goQian();
  };

  function goQian(){
    currentStage=STAGE.QIAN;
    document.getElementById("stage-fanwai").classList.add("hide");
    document.getElementById("stage-qian").classList.remove("hide");
  }

  //签筒点击求签
  document.getElementById("barrel").onclick=()=>{
    document.getElementById("barrel").classList.add("hide");
    document.getElementById("qianRes").classList.remove("hide");
  };

  //看签
  document.getElementById("seeQian").onclick=()=>{
    document.getElementById("jieBlock").classList.remove("hide");
  };

  //解签按钮，展开文本，再启动2秒计时
  document.getElementById("btnJie").onclick=()=>{
    document.getElementById("jieText").classList.remove("hide");
    setTimeout(()=>{
      document.getElementById("tipQian").classList.add("show");
    },2000);
  };

  //签页面点击，跳转结尾
  document.getElementById("stage-qian").addEventListener("click",()=>{
    const tipQian=document.getElementById("tipQian");
    if(!tipQian.classList.contains("show")) return;
    goEnd();
  });

  function goEnd(){
    currentStage=STAGE.END;
    document.getElementById("stage-qian").classList.add("hide");
    document.getElementById("stage-end").classList.remove("hide");
  }
}

window.onload=()=>{
  renderApp();
  setTimeout(()=>{
    document.getElementById("tipEnv").classList.add("show");
  },1200);
};
</script>
</body>
</html>
