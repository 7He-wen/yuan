<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>信笺</title>
<link rel="preload" as="image" href="letter-happy-birthday.JPG">
<link rel="preload" as="image" href="letter-lucky.JPG">
<link rel="preload" as="image" href="letter-autumn.JPG">
<link rel="preload" as="image" href="fanwai2.JPG">
<link rel="preload" as="image" href="fanwai.JPG">
<link rel="preload" as="image" href="fanwai3.JPG">
<style>
:root{--theme:#c99a63;--theme-light:#e7c79b;--theme-glow:rgba(201,154,99,.4);}
*{margin:0;padding:0;box-sizing:border-box;}
body{min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Serif SC",serif;background:#f8f2ec;color:#442c2e;position:relative;}
.stage{width:100vw;min-height:100vh;position:absolute;top:0;left:0;}
.hide{display:none !important;}
.envelope-wrap{width:82vw;max-width:420px;aspect-ratio:1.25/1;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.envelope{width:100%;height:100%;background:url('envelope.JPG') center/contain no-repeat;position:relative;transition:all 1.2s cubic-bezier(0.23,1,0.32,1);}
.envelope.open{transform:translateY(-80px) scale(0.85);opacity:0;}
.letter{width:72vw;max-width:370px;height:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,120%);opacity:0;transition:transform 1.6s cubic-bezier(0.22,1,0.36,1),opacity 1.4s;z-index:10;box-shadow:0 10px 40px rgba(0,0,0,.3);border-radius:4px;}
.letter.show{opacity:1;transform:translate(-50%,-40%);}
.tip-text{position:absolute;bottom:14vh;left:50%;transform:translateX(-50%);font-size:1.1rem;letter-spacing:0.22em;color:#775456;font-style:italic;white-space:nowrap;opacity:0;transition:opacity .6s;z-index:5;}
.tip-text.show{opacity:1;}
#tipJie,#tipEnd,#tipFanwai,#tipGrid{position:fixed;bottom:7vh;}
.pink-btn{border:none;background:#f288a8;color:#fff;padding:14px 42px;border-radius:999px;font-size:1.15rem;letter-spacing:0.14em;position:absolute;left:50%;transform:translateX(-50%);bottom:12vh;opacity:0;transition:opacity .7s;z-index:5;}
.pink-btn.show{opacity:1;}

/* ============ happy番外：fanwai2放大 ============ */
#stage-fanwai{background:#f8f2ec;}
.fanwai-big{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);width:80vw;max-width:460px;opacity:0;transition:transform 5s ease-out,opacity .8s;}
.fanwai-big.show{opacity:1;transform:translate(-50%,-50%) scale(1.14);}
.fanwai-big.fadeout{opacity:0;transform:translate(-50%,-50%) scale(1.2);}

/* ============ 四宫格 ============ */
.grid-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88vw;max-width:480px;aspect-ratio:1/1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#fff;opacity:0;transition:opacity .8s;}
.grid-wrap.show{opacity:1;}
.grid-cell{overflow:hidden;position:relative;}
.grid-cell img{width:100%;height:100%;object-fit:cover;display:block;}
.grid-title{position:absolute;top:-12vh;left:0;right:0;text-align:center;opacity:0;transition:all 1s ease;}
.grid-title.show{opacity:1;top:-10vh;}
.grid-title h2{font-size:1.8rem;letter-spacing:.3em;color:#5a3e2b;font-weight:600;}
.grid-title p{font-size:.78rem;letter-spacing:.4em;color:#a08060;margin-top:8px;font-style:italic;}

/* ============ 求签 ============ */
.qian-wrap{width:100vw;min-height:100vh;background:#e9dfd2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.qian-title{font-size:1.4rem;letter-spacing:0.26em;margin-bottom:40px;color:#60383a;}
.qian-barrel{width:64vw;max-width:320px;aspect-ratio:.75;background:linear-gradient(145deg,#c84c42,#a8322c);border-radius:12px;box-shadow:0 12px 30px rgba(80,30,25,.28);display:flex;align-items:center;justify-content:center;color:#fff8f8;font-size:1.3rem;letter-spacing:0.2em;}
.qian-paper{width:76vw;max-width:400px;background:#fff9ef;border-radius:14px;padding:36px 28px;box-shadow:0 8px 24px rgba(60,30,20,.18);text-align:center;}
.qian-level{font-size:1.4rem;color:#b83c3c;margin-bottom:20px;}
.qian-poem{font-size:1.1rem;line-height:2.2;margin-bottom:28px;display:none;}
.circle-btn{width:62px;height:62px;border-radius:50%;border:2px solid #b83c3c;background:transparent;color:#b83c3c;font-size:.95rem;}
.jieqian-btn{margin-top:24px;border:none;background:#d45c54;color:#fff;padding:12px 30px;border-radius:99px;font-size:1rem;display:none;}
.jie-page{width:100vw;min-height:100vh;background:#f3ece2;padding:40px 24px 14vh;}
.jie-content{line-height:1.9;font-size:1rem;}
.bless-page,.end-page{width:100vw;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
.bless-main{font-size:2.3rem;letter-spacing:.32em;margin-bottom:20px;font-weight:500;}
.bless-sub{font-size:1.25rem;letter-spacing:.20em;margin-bottom:36px;color:#5a4042;}
.bless-en{font-size:1.05rem;opacity:.68;font-style:italic;letter-spacing:.14em;}
.end-main{font-size:2.4rem;letter-spacing:.32em;margin-bottom:16px;}
.end-sub{font-size:1.2rem;letter-spacing:.18em;margin-bottom:32px;}
.end-en{font-size:1rem;opacity:.65;font-style:italic;}

/* ============ 点歌页（动态歌词+律动） ============ */
#stage-songs{background:radial-gradient(120% 90% at 50% 12%,#2a2030 0%,#17111c 55%,#0e0a12 100%);color:#f3e9e4;overflow:hidden;transition:background .8s;}
#stage-songs.lucky-bg{background:radial-gradient(120% 90% at 50% 12%,#3a2a1e 0%,#2a1a12 55%,#1a0f08 100%);}
#stage-songs.autumn-bg{background:radial-gradient(120% 90% at 50% 12%,#1e2a20 0%,#141f16 55%,#0c120e 100%);}
.songs-glow{position:absolute;width:90vw;height:90vw;max-width:560px;max-height:560px;left:50%;top:30%;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--theme-glow),rgba(0,0,0,0) 68%);pointer-events:none;transition:background .8s;opacity:.7;}
.songs-box{position:relative;z-index:2;width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4vh 24px 3vh;text-align:center;box-sizing:border-box;}
.songs-header{width:100%!important;text-align:center!important;margin-bottom:10px!important;min-height:50px!important;z-index:100!important;position:relative!important;display:block!important;visibility:visible!important;}
.page-name{font-size:.8rem!important;letter-spacing:.35em!important;color:#fff!important;opacity:.7!important;margin-bottom:4px!important;font-family:"Microsoft YaHei","PingFang SC",sans-serif!important;width:100%!important;text-align:center!important;display:block!important;visibility:visible!important;}
.np-track{font-size:.75rem!important;letter-spacing:.2em!important;color:rgba(255,255,255,.5)!important;margin-bottom:8px!important;font-family:"Microsoft YaHei","PingFang SC",sans-serif!important;width:100%!important;text-align:center!important;display:block!important;}
.songs-main{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:30px;width:100%;flex:1;min-height:0;}
.songs-bottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px;}
.np-label{display:none;font-size:.7rem;letter-spacing:.46em;color:var(--theme-light);opacity:.9;}
.np-track{display:none;margin-top:6px;font-size:.74rem;letter-spacing:.3em;color:rgba(243,233,228,.45);font-style:italic;}
.lyrics-wrap{height:280px!important;overflow:hidden!important;margin:0!important;width:320px!important;max-width:320px!important;flex:0 0 320px!important;min-width:320px!important;display:block!important;position:relative!important;z-index:50!important;background:transparent!important;visibility:visible!important;}
.lyrics{transition:transform .6s cubic-bezier(.22,1,.36,1)!important;will-change:transform!important;width:100%!important;display:block!important;position:relative!important;}
.lyric-line{height:56px!important;line-height:56px!important;font-size:1rem!important;letter-spacing:.05em!important;color:rgba(255,255,255,.35)!important;text-align:center!important;width:100%!important;max-width:100%!important;margin:0 auto!important;padding:0 10px!important;white-space:normal!important;word-break:break-word!important;box-sizing:border-box!important;display:block!important;overflow:hidden!important;transition:all .5s cubic-bezier(.22,1,.36,1);font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Source Han Sans CN",sans-serif;font-weight:400;}
.lyric-line.active{color:#fff!important;font-size:1.4rem!important;font-weight:700!important;line-height:56px!important;padding:0 10px!important;opacity:1!important;display:block!important;}
.lyric-line.prev-1,.lyric-line.next-1{font-size:1.05rem;opacity:.45;line-height:56px!important;color:rgba(243,233,228,.45);}
.lyric-line.prev-2,.lyric-line.next-2{font-size:.85rem;opacity:.25;color:rgba(243,233,228,.25);transform:scale(.82)!important;}
.lyric-line.far{opacity:0;transform:scale(.8);}
.song-title{font-size:1.25rem!important;font-weight:600!important;color:#fff!important;letter-spacing:.1em!important;margin:0!important;text-align:center!important;text-shadow:0 0 20px var(--theme-glow)!important;font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif!important;opacity:1!important;width:100%!important;display:block!important;visibility:visible!important;}
.np-label{font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
.np-track{font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
.vinyl{display:none!important;}
.vinyl.spin{animation-play-state:running;}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%);border-radius:50%;background:#1d1522;box-shadow:0 0 0 3px var(--theme-glow);}
@keyframes spin{to{transform:rotate(360deg);}}
.progress{width:82%;max-width:420px;height:3px;background:rgba(255,255,255,.14);border-radius:3px;margin:8px 0 20px;overflow:hidden;cursor:pointer;}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--theme),var(--theme-light));border-radius:3px;transition:background .8s;}
.songs-ctrl{display:flex;align-items:center;gap:30px;}
.ctrl{width:56px;height:56px;border-radius:50%;border:1px solid rgba(243,233,228,.28);background:rgba(255,255,255,.05);color:#f3e9e4;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s;}
.ctrl svg{width:22px;height:22px;fill:currentColor;}
.ctrl.main{width:70px;height:70px;background:linear-gradient(145deg,var(--theme-light),var(--theme));color:#231a20;border:none;box-shadow:0 10px 26px var(--theme-glow);transition:background .8s,box-shadow .8s;}
.ctrl.main svg{width:26px;height:26px;}
.ctrl:active{transform:scale(.93);}
.list-toggle{margin-top:22px;background:transparent;border:1px solid rgba(243,233,228,.25);color:#f3e9e4;font-size:.78rem;letter-spacing:.32em;padding:9px 22px;border-radius:999px;cursor:pointer;}
.list-panel{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:66vh;overflow-y:auto;background:rgba(20,15,24,.94);backdrop-filter:blur(18px);border-top:1px solid var(--theme-glow);border-radius:26px 26px 0 0;padding:22px 20px 34px;transform:translateY(105%);transition:transform .4s cubic-bezier(.22,1,.36,1),border-color .8s;}
.list-panel.show{transform:translateY(0);}
.list-panel h4{font-size:.76rem;letter-spacing:.42em;color:var(--theme-light);text-align:center;margin-bottom:16px;font-weight:500;transition:color .8s;}
.song-item{display:flex;align-items:center;gap:16px;padding:13px 8px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;text-align:left;}
.song-item:last-child{border-bottom:none;}
.si-num{font-size:.72rem;color:rgba(243,233,228,.4);font-style:italic;width:24px;flex:none;}
.si-name{font-size:.96rem;letter-spacing:.03em;color:rgba(243,233,228,.82);}
.song-item.active .si-num,.song-item.active .si-name{color:var(--theme-light);transition:color .8s;}
.song-item.active .si-name{font-weight:600;}
.list-close{display:block;margin:14px auto 0;background:transparent;border:none;color:rgba(243,233,228,.6);letter-spacing:.3em;font-size:.76rem;cursor:pointer;}


/* ============ 响应式布局 ============ */
/* 电脑端/iPad（宽度>768px）：左右布局 */
@media(min-width:769px){
  .songs-main{flex-direction:row!important;gap:40px!important;}
  .vinyl{width:180px!important;height:180px!important;}
  .lyrics-wrap{width:100%!important;max-width:100%!important;flex:1!important;min-width:0!important;height:280px!important;margin:0 auto!important;}
  .song-title{font-size:1.4rem!important;}
}
/* 手机端（宽度<=768px）：上下布局 */
@media(max-width:768px){
  .songs-page{overflow:hidden!important;}
  .songs-main{flex-direction:column!important;gap:0px!important;align-items:center!important;justify-content:center!important;padding-left:0px!important;overflow:visible!important;position:relative!important;height:auto!important;min-height:0!important;flex:1!important;}
  .vinyl{display:none!important;}
  .lyrics-wrap{width:100%!important;max-width:100%!important;min-width:0!important;flex:0 0 auto!important;height:250px!important;order:1!important;overflow:hidden!important;margin-top:0px!important;margin-bottom:0px!important;background:transparent!important;margin-left:0px!important;position:relative!important;z-index:2!important;}
  #lyrics{position:relative!important;width:100%!important;padding:0 8px!important;box-sizing:border-box!important;}
  .lyric-line{overflow:visible!important;white-space:nowrap!important;word-break:normal!important;padding:0!important;width:100%!important;max-width:100%!important;background:transparent!important;box-shadow:none!important;font-size:.82rem!important;line-height:50px!important;height:50px!important;text-align:center!important;transition:all .4s ease!important;}
  .lyric-line.active{font-size:1.08rem!important;background:transparent!important;box-shadow:none!important;transform:scale(1.08)!important;color:#fff!important;opacity:1!important;font-weight:700!important;text-shadow:0 2px 12px rgba(0,0,0,.4)!important;}
  .lyric-line.next-1{font-size:.82rem!important;opacity:.55!important;transform:scale(.92)!important;}
  .lyric-line.prev-1{font-size:.82rem!important;opacity:.55!important;transform:scale(.92)!important;}
  .lyric-line.prev-2,.lyric-line.next-2{font-size:.75rem!important;opacity:.4!important;transform:scale(.85)!important;}
  .songs-header{margin-bottom:0px!important;}
  .song-title{font-size:1.1rem!important;}
  .page-name{font-size:.7rem!important;}
  .np-track{font-size:.65rem!important;}
  .songs-box{padding:3vh 16px 3vh!important;display:flex!important;flex-direction:column!important;min-height:100vh!important;box-sizing:border-box!important;}
  .songs-bottom{margin-top:0px!important;padding-top:0px!important;}
  .progress{width:100%!important;max-width:100%!important;margin:0 0 16px!important;}
  .ctrl{width:48px!important;height:48px!important;}
  .ctrl.main{width:64px!important;height:64px!important;}
  .songs-ctrl{gap:24px!important;margin-bottom:12px!important;}
}
/* 小屏手机（宽度<=480px） */
@media(max-width:480px){
  .vinyl{display:none!important;}
  .lyrics-wrap{height:250px!important;}
  .lyric-line{height:50px!important;line-height:50px!important;font-size:.82rem!important;}
  .lyric-line.active{font-size:1.08rem!important;}
  .lyric-line.next-1,.lyric-line.prev-1{font-size:.82rem!important;opacity:.55!important;}
  .lyric-line.prev-2,.lyric-line.next-2{font-size:.75rem!important;opacity:.4!important;}
}

/* ============ photo模式：堆叠照片 ============ */
#stage-photo{background:linear-gradient(135deg,#f5ede4 0%,#e8dcc8 100%);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.photo-stack{position:relative;width:78vw;max-width:400px;height:78vw;max-height:400px;cursor:pointer;}
.photo-card{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:8px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25);transition:all .7s cubic-bezier(.22,1,.36,1);background:#fff;padding:10px;}
.photo-card img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block;}
.photo-card:nth-child(1){transform:rotate(-6deg) translate(-8px,-4px);z-index:2;}
.photo-card:nth-child(2){transform:rotate(5deg) translate(10px,6px);z-index:1;}
.photo-stack.open .photo-card:nth-child(1){transform:rotate(-2deg) translate(-55%,0) scale(.92);z-index:2;}
.photo-stack.open .photo-card:nth-child(2){transform:rotate(2deg) translate(55%,0) scale(.92);z-index:1;}
.photo-hint{position:absolute;bottom:8vh;left:0;right:0;text-align:center;font-size:.9rem;letter-spacing:.3em;color:#8a7060;font-style:italic;opacity:.7;animation:hintPulse 2s ease-in-out infinite;}
@keyframes hintPulse{0%,100%{opacity:.4;}50%{opacity:.85;}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const urlParams=new URLSearchParams(location.search);
let mode=urlParams.get('mode')||"happybirthday";
const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const ICON_PREV='<svg viewBox="0 0 24 24"><path d="M18 6v12l-8-6zM6 6h2.4v12H6z"/></svg>';
const ICON_NEXT='<svg viewBox="0 0 24 24"><path d="M6 6v12l8-6zM15.6 6H18v12h-2.4z"/></svg>';

/* ============ 歌曲分类配置 ============
   happy：文艺浪漫生日类
   lucky：童年活泼类（需上传：happy-fly.mp3开心往前飞 / happy-girl.mp3快乐女孩 / never-left.mp3你从未离去）
   autumn：秋日沉静文艺类
   主题曲音量 themeVolume 为背景音乐低音量，点歌页歌曲正常音量 */
const configMap={
  happybirthday:{
    letterImg:"letter-happy-birthday.JPG",
    qianTitle:"娄星纳福 【上签 · 吉】",
    qianPoem:"娄曜临辰纳岁光，<br>前尘得失尽深藏。<br>胸怀旷达机缘至，<br>静守清风福满堂。",
    jieText:"厚积得福之象<br><br>此为收纳沉淀之吉签，不求一时轰轰烈烈，贵在把过往经历化作自身底气。机缘不急于即刻显现，心怀开阔，则好运徐徐而至。<br><br>宜静不宜躁，适合复盘规划，蓄力沉淀。切勿冲动冒险求变，静待时机自有际遇登门。<br><br>人缘和顺，易得旁人真诚惦念。偏爱细水长流，平淡相守胜过喧嚣热闹。<br><br>守成为上，宜储蓄积累，忌冒进投机，安稳即是增益。<br><br>往事皆沉淀，心宽福自来，<br>生辰逢吉曜，岁岁得安怀。",
    endTitle:"生日快乐",endSub:"祝你开心快乐",endEn:"Wish you joy & happiness all the way",
    theme:"where-did-u-go.mp3",themeVolume:0.32,
    songsClass:"",
    fanwaiFirst:"fanwai2.JPG",
    fanwaiGrid:["fanwai.JPG","letter-lucky.JPG","letter-autumn.JPG","fanwai3.JPG"],
    fanwaiName:"刘丽元专属",
    fanwaiNameEn:"FOR LIU LIYUAN",
    blessMain:"生日快乐",
    blessSub:"祝你开心快乐",
    blessEn:"Wish you joy & happiness all the way",

  },50);
}
function initAudioVis(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    srcNode=audioCtx.createMediaElementSource(audio);
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=256;
    analyser.smoothingTimeConstant=0.78;
    dataArr=new Uint8Array(analyser.frequencyBinCount);
    srcNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }catch(e){}
}
function resumeAudio(){ if(audioCtx&&audioCtx.state==="suspended")audioCtx.resume().catch(function(){}); }
function startVisLoop(){
  if(visRunning)return; visRunning=true;
  (function loop(){
    requestAnimationFrame(loop);
    if(!analyser)return;
    analyser.getByteFrequencyData(dataArr);
    let bass=0;
    const q=Math.floor(dataArr.length/4);
    for(let i=0;i<q;i++)bass+=dataArr[i];
    bass/=(q*255);
    const active=document.querySelector('.lyric-line.active');
    if(active)active.style.transform='scale('+(1+bass*0.22)+')';
    const vinyl=document.getElementById('vinyl');
    if(vinyl)vinyl.style.boxShadow='0 16px '+(34+bass*30)+'px rgba(0,0,0,.6), 0 0 '+(bass*70)+'px var(--theme-glow), inset 0 0 0 1px rgba(255,255,255,.06)';
    const glow=document.querySelector('.songs-glow');
    if(glow)glow.style.opacity=(0.45+bass*0.9);
  })();
}
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return r+','+g+','+b;
}
function setTheme(hex){
  const root=document.documentElement.style;
  const lr=Math.min(255,parseInt(hex.slice(1,3),16)+40).toString(16).padStart(2,'0');
  const lg=Math.min(255,parseInt(hex.slice(3,5),16)+40).toString(16).padStart(2,'0');
  const lb=Math.min(255,parseInt(hex.slice(5,7),16)+40).toString(16).padStart(2,'0');
  root.setProperty('--theme',hex);
  root.setProperty('--theme-light','#'+lr+lg+lb);
  root.setProperty('--theme-glow','rgba('+hexToRgb(hex)+',.42)');
}

function bindEvents(){
  const stageEnv=document.getElementById("stage-env");
  const env=document.getElementById("env");
  const letter=document.getElementById("letter");
  const tipEnv=document.getElementById("tipEnv");
  const modeBtn=document.getElementById("modeBtn");
  if(modeBtn)modeBtn.classList.remove("show");

  stageEnv.addEventListener("click",function(){
    if(currentStage!==STAGE.ENVELOPE)return;
    // 如果信已经展开，第二次点击进入番外
    if(letter.classList.contains("show")&&env.classList.contains("open")){
      if(mode==="happybirthday"){
        goFanwai();
        return;
      }
    }
    tipEnv.classList.remove("show");
    letter.classList.add("show");
    playTheme();
    setTimeout(function(){env.classList.add("open");},1600);
    if(mode==="lucky"||mode==="autumn"){
      setTimeout(function(){modeBtn.classList.add("show");},4000);
    }else if(mode==="happybirthday"){
      // 信完全展开后显示提示，点击屏幕才进入番外
      setTimeout(function(){
        tipEnv.textContent="轻点屏幕 · 进入回忆";
        tipEnv.classList.add("show");
      },2200);
    }else if(mode==="photo"){
      setTimeout(goPhoto,2000);
    }
  });

  if(mode==="lucky"||mode==="autumn"){
    modeBtn.onclick=function(){
      currentStage=STAGE.BLESS;
      document.getElementById("stage-env").classList.add("hide");
      document.getElementById("stage-bless").classList.remove("hide");
      setTimeout(function(){
        const tip=document.createElement("div");
        tip.className="tip-text";
        tip.style.cssText="position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);font-size:1rem;letter-spacing:.2em;color:#fff;opacity:.8;z-index:10;";
        tip.textContent="轻点屏幕 · 聆听音乐";
        document.getElementById("stage-bless").appendChild(tip);
        document.getElementById("stage-bless").onclick=function(){
          currentStage=STAGE.SONGS;
          document.getElementById("stage-bless").classList.add("hide");
          goSongs();
        };
      },1500);
    };
  }

  if(mode==="happybirthday") bindHappy();
  if(cfg.songs) bindSongs();
  if(mode==="photo") bindPhoto();
}

/* ===== happy番外重做：fanwai2放大 → 四宫格 → 刘丽元专属 → 求签 ===== */
function goFanwai(){
  currentStage=STAGE.FANWAI;
  fanwaiStep=0;
  document.getElementById("stage-env").classList.add("hide");
  document.getElementById("stage-fanwai").classList.remove("hide");
  const big=document.getElementById("fanwaiBig");
  big.classList.remove("fadeout");
  setTimeout(function(){big.classList.add("show");},100);
  setTimeout(function(){document.getElementById("tipFanwai").classList.add("show");},4200);
  document.getElementById("stage-fanwai").onclick=function(){
    const tip=document.getElementById("tipFanwai");
    if(!tip.classList.contains("show"))return;
    tip.classList.remove("show");
    if(fanwaiStep===0){
      fanwaiStep=1;
      const big=document.getElementById("fanwaiBig");
      big.classList.add("fadeout");
      setTimeout(function(){
        big.classList.add("hide");
        const gw=document.getElementById("gridWrap");
        gw.classList.add("show");
        setTimeout(function(){document.getElementById("gridTitle").classList.add("show");},1800);
        setTimeout(function(){tip.classList.add("show");},3200);
      },700);
    }else if(fanwaiStep===1){
      fanwaiStep=2;
      goQian();
    }
  };
}

  document.getElementById("stage-fanwai").classList.add("hide");

/* ===== 点歌页：动态歌词+律动+主题色 ===== */
let lyricLines=[],lyricIndex=-1;
function bindSongs(){
  if(!cfg.songs)return;
  const vinyl=document.getElementById("vinyl");
  const npTrack=document.getElementById("npTrack");
  const progBar=document.getElementById("progBar");
  const prog=document.getElementById("prog");
  const btnPlayPause=document.getElementById("btnPlayPause");
  const listPanel=document.getElementById("listPanel");
  const list=document.getElementById("songList");
  const total=cfg.songs.length;
  list.innerHTML="";
  cfg.songs.forEach(function(s,i){
    const item=document.createElement("div");
    item.className="song-item";
    const num=document.createElement("span");
    num.className="si-num";
    num.textContent=String(i+1).padStart(2,"0");
    const name=document.createElement("span");
    name.className="si-name";
    name.textContent=s.t;
    item.appendChild(num);item.appendChild(name);
    item.addEventListener("click",function(){loadSong(i,true);toggleList(false);});
    list.appendChild(item);
  });
  function setPlayingUI(playing){
    vinyl.classList.toggle("spin",playing);
    btnPlayPause.innerHTML=playing?ICON_PAUSE:ICON_PLAY;
  }
  function highlight(i){
    list.querySelectorAll(".song-item").forEach(function(el,idx){el.classList.toggle("active",idx===i);});
  }
  function buildLyrics(song){
    const box=document.getElementById("lyrics");
    box.innerHTML="";
    lyricLines=[];
    if(song.lyrics&&song.lyrics.length){
      if(typeof song.lyrics[0]==="string"){
        const dur=(audio&&audio.duration&&isFinite(audio.duration))?audio.duration:200;
        song.lyrics.forEach(function(l,i){lyricLines.push({t:i*dur/song.lyrics.length,l:l});});
      }else{
        song.lyrics.forEach(function(x){lyricLines.push({t:x.t,l:x.l});});
      }
    }else{
      lyricLines.push({t:0,l:song.t});
    }
    lyricLines.forEach(function(x){
      const d=document.createElement("div");
      d.className="lyric-line";
      d.textContent=x.l;
      box.appendChild(d);
    });
    lyricIndex=-1;
    updateLyric();
  }
  function updateLyric(){
    if(!audio||!lyricLines||!lyricLines.length)return;
    let idx=-1;
    const ct=audio?audio.currentTime:0;
    for(let i=0;i<lyricLines.length;i++){
      if(ct>=lyricLines[i].t)idx=i;
    }
    // 前奏阶段(idx=-1)默认显示第0句
    const showIdx=idx>=0?idx:0;
    if(showIdx!==lyricIndex){
      lyricIndex=showIdx;
      const lines=document.querySelectorAll(".lyric-line");
      lines.forEach(function(el,i){
        el.classList.remove("active","prev-1","prev-2","next-1","next-2","far");
        el.style.fontSize="";
        const diff=i-showIdx;
        if(diff===0){
          el.classList.add("active");
          // 长歌词动态缩小字号，确保全部展示
          const text=lyricLines[i]?lyricLines[i].l:"";
          const isMobile=window.innerWidth<=768;
          const containerW=isMobile?window.innerWidth-32:320;
          const baseSize=isMobile?1.05:1.4;
          if(text.length>12){
            const shrink=Math.max(0.65,1-(text.length-12)*0.025);
            el.style.fontSize=(baseSize*shrink)+"rem";
          }
        }
        else if(diff===-1)el.classList.add("prev-1");
        else if(diff===-2)el.classList.add("prev-2");
        else if(diff===1)el.classList.add("next-1");
        else if(diff===2)el.classList.add("next-2");
        else if(diff<-2||diff>2)el.classList.add("far");
      });
      var lineH=window.innerWidth<=768?50:56;document.getElementById("lyrics").style.transform="translateY("+(-showIdx*lineH+lineH*2)+"px)";
    }
  }
  function loadSong(i,autoplay){
    currentSong=i;
    const s=cfg.songs[i];
    ensureAudio();initAudioVis();resumeAudio();startVisLoop();
    stopThemeFade();
    setTheme(s.color);
    audio.loop=false;
    audio.volume=0.7;
    audio.onended=randomNext;
    audio.ontimeupdate=function(){
      if(audio.duration){progBar.style.width=(audio.currentTime/audio.duration*100)+"%";}
      updateLyric();
    };
    audio.src=s.f;
    const npTrackEl=document.getElementById("npTrack");
    if(npTrackEl)npTrackEl.textContent="Track "+String(i+1).padStart(2,"0")+" / "+String(cfg.songs.length).padStart(2,"0");
    const songTitleEl=document.getElementById("songTitle");
    if(songTitleEl)songTitleEl.textContent=s.t||"";
    const pageNameEl=document.getElementById("pageName");
    if(pageNameEl){pageNameEl.textContent=mode==="happybirthday"?"HAPPY BIRTHDAY":mode==="lucky"?"LUCKY":mode==="autumn"?"AUTUMN":"MUSIC";}
    highlight(i);
    buildLyrics(s);
    progBar.style.width="0%";
    if(autoplay){audio.play().catch(function(){});setPlayingUI(true);}
  }
  function randomDifferent(cur){
    if(total<=1)return 0;
    var n;do{n=Math.floor(Math.random()*total);}while(n===cur);
    return n;
  }
  function randomNext(){loadSong(randomDifferent(currentSong),true);}
  btnPlayPause.onclick=function(e){
    e.stopPropagation();
    ensureAudio();resumeAudio();
    if(audio.paused){audio.play().catch(function(){});setPlayingUI(true);}
    else{audio.pause();setPlayingUI(false);}
  };
  document.getElementById("btnNextSong").onclick=function(e){e.stopPropagation();randomNext();};
  document.getElementById("btnShuffle").onclick=function(e){e.stopPropagation();randomNext();};
  prog.addEventListener("click",function(e){
    if(!audio)return;
    if(!audio.duration||isNaN(audio.duration)){setTimeout(function(){if(audio&&audio.duration&&!isNaN(audio.duration)){const r=prog.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;}},300);return;}
    const r=prog.getBoundingClientRect();
    audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
  });
  function toggleList(show){listPanel.classList.toggle("show",show);}
  document.getElementById("btnList").onclick=function(e){e.stopPropagation();toggleList(true);};
  document.getElementById("listClose").onclick=function(e){e.stopPropagation();toggleList(false);};
  // 点击歌单列表外的区域自动收起
  document.addEventListener("click",function(e){
    if(!listPanel.contains(e.target)&&e.target.id!=="btnList"&&!e.target.closest("#btnList")){
      toggleList(false);
    }
  });
  listPanel.addEventListener("click",function(e){e.stopPropagation();});
  window.__loadSong=loadSong;
  window.__randomNext=randomNext;
  window.__setPlayingUI=setPlayingUI;
  if(typeof bindPhoto==="function")bindPhoto();
}
function goSongs(){
  currentStage=STAGE.SONGS;
  const endEl=document.getElementById("stage-end");
  if(endEl)endEl.classList.add("hide");
  document.getElementById("stage-songs").classList.remove("hide");
  window.scrollTo(0,0);
  // 停止主题曲
  stopThemeFade();
  if(audio){audio.pause();audio.currentTime=0;}
  ensureAudio();
  var first=Math.floor(Math.random()*(cfg.songs.length));
  window.__loadSong(first,true);
}

/* ===== photo模式：堆叠照片 ===== */
function goPhoto(){
  currentStage=STAGE.PHOTO;
  document.getElementById("stage-env").classList.add("hide");
  document.getElementById("stage-photo").classList.remove("hide");
}
function bindPhoto(){
  const stack=document.getElementById("photoStack");
  if(!stack)return;
  stack.onclick=function(){
    stack.classList.toggle("open");
  };
}

window.onload=function(){
  try{
    renderApp();
    if(mode==="photo"){
      setTimeout(function(){
        try{if(typeof goPhoto==="function")goPhoto();}catch(e){console.error("goPhoto error:",e);}
        try{if(typeof bindPhoto==="function")bindPhoto();}catch(e){console.error("bindPhoto error:",e);}
      },300);
    }else{
      setTimeout(function(){
        try{
          const tip=document.getElementById("tipEnv");
          if(tip)tip.classList.add("show");
        }catch(e){console.error("tip error:",e);}
      },1200);
    }
  }catch(e){
    console.error("Init error:",e);
    document.body.innerHTML='<div style="color:#fff;padding:40px;font-family:sans-serif;">加载出错: '+e.message+'</div>';
  }
};
