<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>专属手写信</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#f8f2f6;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","STSong","Microsoft YaHei",serif;
}

.container{
  position:relative;
  width:90vw;
  max-width:420px;
  aspect-ratio: 0.85;
}
.envelope{
  position:absolute;
  width:100%;
  height:100%;
  z-index:2;
}
.envelope img{width:100%;height:100%;object-fit:contain;}

.letter-wrap{
  position:absolute;
  width:82%;
  height:88%;
  left:9%;
  bottom:10%;
  z-index:1;
  transform-origin:center bottom;
  animation: pullOut 3s ease-out forwards, unfold 2.2s ease-out 3.2s forwards;
  transform: translateY(0) scaleY(0.22);
}
.letter-wrap img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:6px;
}

@keyframes pullOut{
  0%{transform: translateY(0) scaleY(0.22);}
  100%{transform: translateY(-40px) scaleY(1);}
}
@keyframes unfold{
  0%{opacity:0.4;}
  100%{opacity:1;}
}

.art-btn{
  margin-top:80px;
  padding:12px 36px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,#f8a8c8,#f488b8);
  color:#fff;
  font-size:17px;
  letter-spacing:2px;
  box-shadow:0 6px 20px rgba(248,168,200,0.5);
  opacity:0;
  animation:btnFade 6s ease forwards;
  display:none;
}
.art-btn.show{display:block;}
@keyframes btnFade{
  to{opacity:1;}
}

.pop-layer{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  background:#000000dd;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:99;
  padding:20px;
}
.pop-layer.show{display:flex;}

.art-text-top{
  font-size:26px;
  color:#f8d8e8;
  letter-spacing:4px;
  margin-bottom:12px;
  font-weight:500;
}
.art-text-bottom{
  font-size:22px;
  color:#fff;
  letter-spacing:3px;
}
.eng-text{
  font-size:13px;
  color:#f8c8d8;
  letter-spacing:1px;
  margin:16px 0 6px;
  opacity:0.85;
}
.birth-img{
  width:85vw;
  max-width:380px;
  border-radius:12px;
  margin:10px 0;
  display:none;
}
.birth-img.show{display:block;}
.close-tip{
  margin-top:30px;
  color:#f8b8c8;
  font-size:15px;
  letter-spacing:1px;
}

/* 签筒 NFC部分 */
.tube-wrap{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  z-index:10;
  text-align:center;
}
.tube-wrap.show{display:block;}
.tube{
  width:110px;
  height:140px;
  background:#b84040;
  border-radius:6px 6px 14px 14px;
  position:relative;
  margin:0 auto;
  cursor:pointer;
}
.stick{
  position:absolute;
  width:8px;
  height:90px;
  background:#f8e8d0;
  border-radius:4px;
  top:-70px;
  left:50%;
  transform:translateX(-50%);
  opacity:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#992222;
  font-size:12px;
  writing-mode:vertical-rl;
  letter-spacing:2px;
}
.stick.out{
  opacity:1;
  animation:stickFly 1s ease forwards;
}
@keyframes stickFly{
  0%{top:-70px;}
  100%{top:-110px;}
}
.tip-desc{
  margin-top:12px;
  color:#c06080;
  font-size:14px;
}

.paper-pop{
  position:fixed;
  top:0;left:0;
  width:100vw;height:100vh;
  background:#00000066;
  z-index:120;
  display:none;
  justify-content:center;
  align-items:center;
  padding:24px;
}
.paper-pop.show{display:flex;}
.paper-card{
  background:#fff8e8;
  width:86vw;
  max-width:360px;
  max-height:85vh;
  overflow-y:auto;
  padding:28px 22px;
  border-radius:14px;
  box-shadow:0 8px 30px rgba(0,0,0,0.25);
}
.paper-title{
  text-align:center;
  font-size:20px;
  color:#a83838;
  margin-bottom:14px;
  letter-spacing:2px;
}
.paper-short{
  text-align:center;
  font-size:17px;
  color:#772222;
  margin-bottom:20px;
}
.paper-full{
  font-size:15px;
  line-height:1.8;
  color:#333;
  display:none;
}
.paper-full.show{display:block;}
.btn-group{
  margin-top:22px;
  display:flex;
  gap:12px;
  justify-content:center;
}
.pop-btn{
  padding:8px 18px;
  border-radius:30px;
  border:none;
  background:#d46060;
  color:#fff;
  font-size:14px;
}
.close-paper-tip{
  margin-top:20px;
  text-align:center;
  color:#b84444;
  font-size:14px;
}

audio{
  position:fixed;
  bottom:4px;
  opacity:0;
  pointer-events:none;
}
</style>
</head>
<body>

<div class="container">
  <div class="envelope">
    <img src="envelope.JPG" alt="信封">
  </div>
  <div class="letter-wrap">
    <img id="letterImg" alt="信纸">
  </div>
</div>

<button class="art-btn" id="mainBtn">番外</button>

<div class="pop-layer" id="popLayer">
  <div class="eng-text" id="engTop"></div>
  <div class="art-text-top" id="textTop"></div>
  <div class="art-text-bottom" id="textBottom"></div>
  <img class="birth-img" id="img1" src="fanwai.JPG">
  <img class="birth-img" id="img2" src="fanwai2.JPG">
  <div class="eng-text" id="engBot"></div>
  <div class="close-tip">点击空白处关闭</div>
</div>

<div class="tube-wrap" id="tubeWrap">
  <div class="tube" id="tubeBox">
    <div class="stick" id="stickEl">上签·娄星纳福</div>
  </div>
  <div class="tip-desc">点击签筒求签</div>
</div>

<div class="paper-pop" id="paperPop">
  <div class="paper-card">
    <div class="paper-title">🎋灵签 第三十七签</div>
    <div class="paper-short">上签 · 娄星纳福</div>
    <div class="paper-full" id="paperContent">
娄曜临辰纳岁光，<br>
前尘得失尽深藏。<br>
胸怀旷达机缘至，<br>
静守清风福满堂。<br><br>
【总断】厚积待时之象<br>
此为厚积得福之上签，不必追逐浮华，默默沉淀积蓄力量，时机到来自有美好际遇。<br><br>
【学业事业】<br>
宜沉心复盘，厚积蓄力，不宜冒进求速，静待机遇自会登门。<br><br>
【人际情缘】<br>
待人真诚自有相知之人，细水长流胜过轰轰烈烈。<br><br>
【财禄】<br>
守成为上，忌投机冒险，安稳即是吉兆。<br><br>
【结语】<br>
过往沉潜皆为铺垫，心宽志远，岁岁安康。
    </div>
    <div class="btn-group">
      <button class="pop-btn" id="expandBtn">展开</button>
      <button class="pop-btn" id="jumpBtn">解签</button>
    </div>
    <div class="close-paper-tip">点击空白关闭</div>
  </div>
</div>

<audio id="bgAudio" preload="metadata">

<script>
const params=new URLSearchParams(location.search);
const mode=params.get("mode")||"lucky";

const data={
  lucky:{
    img:"letter-lucky.JPG",
    audio:"lucky.mp3",
    btnText:"幸运",
    engTop:"LUCKY BLESSING",
    topTxt:"四叶草 🍀",
    botTxt:"予你好运",
    engBot:"Wish you all the best"
  },
  autumn:{
    img:"letter-autumn.JPG",
    audio:"autumn.mp3",
    btnText:"秋天",
    engTop:"AUTUMN WISH",
    topTxt:"枫落知秋",
    botTxt:"寄此岁岁安",
    engBot:"Quiet days, gentle years"
  },
  happybirthday:{
    img:"letter-happybirthday.JPG",
    audio:"happy birthday.mp3",
    btnText:"番外",
    engTop:"HAPPY MEMORY",
    topTxt:"",
    botTxt:"祝你生日快乐",
    engBot:"May all your wishes come true"
  }
};

const cfg=data[mode];
document.querySelector("#letterImg").src=cfg.img;
document.querySelector("#mainBtn").innerText=cfg.btnText;
document.querySelector("#bgAudio").src=cfg.audio;

const mainBtn=document.querySelector("#mainBtn");
const popLayer=document.querySelector("#popLayer");
const engTop=document.querySelector("#engTop");
const textTop=document.querySelector("#textTop");
const textBottom=document.querySelector("#textBottom");
const engBot=document.querySelector("#engBot");
const img1=document.querySelector("#img1");
const img2=document.querySelector("#img2");
const tubeWrap=document.querySelector("#tubeWrap");
const tubeBox=document.querySelector("#tubeBox");
const stickEl=document.querySelector("#stickEl");
const paperPop=document.querySelector("#paperPop");
const paperContent=document.querySelector("#paperContent");
const expandBtn=document.querySelector("#expandBtn");
const jumpBtn=document.querySelector("#jumpBtn");

// 6秒后显示按钮
setTimeout(()=>{
  mainBtn.classList.add("show");
},6000);

// 生日模式，关闭弹窗后显示签筒
mainBtn.onclick=()=>{
  engTop.innerText=cfg.engTop;
  textTop.innerText=cfg.topTxt;
  textBottom.innerText=cfg.botTxt;
  engBot.innerText=cfg.engBot;
  popLayer.classList.add("show");
  if(mode==="happybirthday"){
    img1.classList.add("show");
    setTimeout(()=>{
      img1.classList.remove("show");
      img2.classList.add("show");
    },2200);
  }
};

popLayer.onclick=(e)=>{
  if(e.target===popLayer){
    popLayer.classList.remove("show");
    img1.classList.remove("show");
    img2.classList.remove("show");
    if(mode==="happybirthday"){
      tubeWrap.classList.add("show");
    }
  }
};

// 签筒逻辑
tubeBox.onclick=()=>{
  stickEl.classList.add("out");
  setTimeout(()=>{
    paperPop.classList.add("show");
  },1100);
};

paperPop.onclick=(e)=>{
  if(e.target===paperPop){
    paperPop.classList.remove("show");
    stickEl.classList.remove("out");
    paperContent.classList.remove("show");
    expandBtn.style.display="inline-block";
    jumpBtn.style.display="none";
  }
};

expandBtn.onclick=()=>{
  paperContent.classList.add("show");
  expandBtn.style.display="none";
  jumpBtn.style.display="inline-block";
};
jumpBtn.onclick=()=>{
  paperPop.querySelector(".paper-card").scrollTop=paperPop.querySelector(".paper-card").scrollHeight;
};
</script>
</body>
</html>
